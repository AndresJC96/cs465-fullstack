
<div class="container mt-4">
  <h2>Edit Trip</h2>
  

  <div *ngIf="trip">
    <form #tripForm="ngForm" (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <label class="form-label">Trip Code</label>
        <input class="form-control"
               name="code"
               [(ngModel)]="trip.code"
               readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Trip Name</label>
        <input class="form-control"
               name="name"
               [(ngModel)]="trip.name"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Length</label>
        <input class="form-control"
               name="length"
               [(ngModel)]="trip.length"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Start Date</label>
        <input class="form-control"
               name="start"
               [(ngModel)]="trip.start"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Resort</label>
        <input class="form-control"
               name="resort"
               [(ngModel)]="trip.resort"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Price Per Person</label>
        <input class="form-control"
               name="perPerson"
               [(ngModel)]="trip.perPerson"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Image Filename</label>
        <input class="form-control"
               name="image"
               [(ngModel)]="trip.image"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control"
                  name="description"
                  [(ngModel)]="trip.description"
                  required></textarea>
      </div>

      <button class="btn btn-primary"
              type="submit"
              [disabled]="tripForm.invalid">
        Update Trip
      </button>

    </form>
  </div>

  <p class="text-danger mt-3">{{ message }}</p>
</div>
