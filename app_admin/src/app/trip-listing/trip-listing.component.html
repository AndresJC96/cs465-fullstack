
<div class="container mt-4">
  <h2>Trip Listing</h2>
  <p class="alert alert-info">{{ message }}</p>

  <!-- Search, filter, and sorting options -->
  <div class="row mb-4">
    <div class="col-md-4 mb-2">
      <label for="search">Search Trips</label>
      <input
        id="search"
        type="text"
        class="form-control"
        placeholder="Search by name or resort"
        [(ngModel)]="searchTerm">
    </div>

    <div class="col-md-4 mb-2">
      <label for="maxPrice">Maximum Price</label>
      <input
        id="maxPrice"
        type="number"
        min="0"
        class="form-control"
        placeholder="Enter maximum price"
        [(ngModel)]="maxPrice">
    </div>

    <div class="col-md-4 mb-2">
      <label for="sort">Sort Trips</label>
      <select
        id="sort"
        class="form-select"
        [(ngModel)]="sortBy">
        <option value="name">Name (A-Z)</option>
        <option value="price">Price (Low to High)</option>
      </select>
    </div>
  </div>

  <!-- Display filtered trips -->
  <div class="row">
    <div class="col-md-4 mb-4"
         *ngFor="let trip of filteredTrips">
      <div class="card h-100">

        <img
          [src]="'images/' + trip.image"
          class="card-img-top"
          [alt]="trip.name"
          *ngIf="trip.image">

        <div class="card-body">
          <h5 class="card-title">{{ trip.name }}</h5>

          <h6 class="card-subtitle mb-2 text-muted">
            {{ trip.resort }} - {{ trip.length }}
          </h6>

          <p class="card-text">{{ trip.description }}</p>
        </div>

        <div class="card-footer text-muted">
          <strong>{{ trip.perPerson | currency }}</strong>
          per person

          <div class="mt-2">
            <a
              [routerLink]="['/edit-trip', trip.code]"
              class="btn btn-warning">
              Edit Trip
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <p *ngIf="trips.length > 0 && filteredTrips.length === 0"
     class="alert alert-warning">
    No trips match your search or filters.
  </p>
</div>
